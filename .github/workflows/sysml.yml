name: sysml
on: [push, pull_request]

env:
  PILOT_URL: https://github.com/Systems-Modeling/SysML-v2-Pilot-Implementation/releases/download/2026-08/jupyter-sysml-kernel-0.62.0.zip
  PILOT_SHA256: 5a015ed3f2b3d2dae14e9c3fb9602d9e1fef5f9ce33cf396c422329405cc3cb2

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install "build123d==0.11.1" cairosvg jupyter_client   # cinva_drawings needs Vertex.to_tuple (removed in 0.12)

      - name: SysML v2 pilot kernel (pinned, hash-checked)
        run: |
          curl -sL -o pilot.zip "$PILOT_URL"
          echo "$PILOT_SHA256  pilot.zip" | sha256sum -c
          unzip -q pilot.zip -d sysml-kernel
          python3 sysml-kernel/install.py --user

      - name: Drift + solver + regenerate results
        run: python3 sysml_sync.py            # exit 1 drift, 2 failed check

      - name: Validate SysML
        run: python3 sysml_lint.py CinvaRam.sysml CinvaRamResults.sysml CinvaRamTrade.sysml

      - name: Committed results are current
        run: git diff --exit-code -I '^ \* ceb @' -- CinvaRamResults.sysml

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: sysml-results, path: CinvaRamResults.sysml }
